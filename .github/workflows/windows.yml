name: Windows native build
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
    inputs:
      audio_smoke:
        description: 'Run real audio/crossfade smoke test (requires a working audio output on runner)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
      - name: Ensure WiX 3 packaging tools
        shell: pwsh
        run: |
          $wix = Get-ChildItem 'C:\Program Files (x86)' -Filter 'WiX Toolset v3*' -Directory | Select-Object -First 1
          if (-not $wix) {
            choco install wixtoolset --version=3.14.1 --allow-downgrade -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
            $wix = Get-ChildItem 'C:\Program Files (x86)' -Filter 'WiX Toolset v3*' -Directory | Select-Object -First 1
          }
          if (-not $wix) { throw 'WiX 3 not found' }
          "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build native Windows media integration
        shell: pwsh
        run: ./platform-windows/build.ps1
      - name: Verify Windows system media session
        shell: pwsh
        run: |
          & ./build/windows-helper/PodiumMediaBridge.exe --self-test | Tee-Object -FilePath windows-media-smoke.txt
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows media integration failed' }
      - name: Tests and native packages
        run: .\gradlew.bat --no-daemon :shared-domain:check :app-desktop:check :app-desktop:createDistributable :app-desktop:packageMsi :app-desktop:packageExe
      - name: Launch packaged app and verify rendered window
        shell: pwsh
        run: |
          $exe = Resolve-Path 'app-desktop/build/compose/binaries/main/app/Podium Air/Podium Air.exe'
          $result = Join-Path $PWD 'ui-smoke.txt'
          $png = Join-Path $PWD 'ui-smoke.png'
          $p = Start-Process -FilePath $exe -ArgumentList @('--ui-smoke', "--result=`"$result`"", "--screenshot=`"$png`"") -PassThru
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'UI startup smoke timed out' }
          if (-not (Test-Path $result)) { throw 'App exited without rendering the Compose window' }
          Get-Content $result
          if ($p.ExitCode -ne 0) { throw "UI process failed with $($p.ExitCode)" }
      - name: Attempt real audio integration smoke
        shell: pwsh
        run: |
          $exe = Resolve-Path 'app-desktop/build/compose/binaries/main/app/Podium Air/Podium Air.exe'
          $result = Join-Path $PWD 'audio-smoke.txt'
          $p = Start-Process -FilePath $exe -ArgumentList @('--audio-smoke', "--result=`"$result`"") -PassThru
          if (-not $p.WaitForExit(45000)) { $p.Kill(); throw 'Audio integration smoke timed out' }
          if (Test-Path $result) { Get-Content $result }
          if (-not (Test-Path $result)) { throw 'Audio process exited without a result (runtime/packaging failure)' }
          if ($p.ExitCode -ne 0) {
            $devices = @(Get-CimInstance Win32_SoundDevice)
            $failure = Get-Content $result -Raw
            $force = '${{ inputs.audio_smoke }}' -eq 'true'
            if ($devices.Count -eq 0 -and -not $force -and $failure -match 'Could not create player|MEDIA_UNAVAILABLE|Timed out waiting for') {
              "BLOCKED: This cloud runner has no audio output device. Native audio smoke was attempted: $failure" | Set-Content $result
              Get-Content $result
            } else { throw "Real audio integration failed: $failure" }
          }
      - name: Verify packaged playback for each supported codec
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Could not install the test-only media encoder' }
          }
          $exe = Resolve-Path 'app-desktop/build/compose/binaries/main/app/Podium Air/Podium Air.exe'
          $codecs = @{flac='flac'; opus='libopus'; mp3='libmp3lame'; m4a='aac'; aiff='pcm_s16be'}
          foreach ($extension in @('flac', 'opus', 'mp3', 'm4a', 'aiff')) {
            $media = Join-Path $PWD "fixture.$extension"
            & ffmpeg -hide_banner -loglevel error -f lavfi -i 'sine=frequency=440:duration=6' -ac 1 -c:a $codecs[$extension] -y $media
            if ($LASTEXITCODE -ne 0) { throw "Could not encode $extension fixture" }
            $result = Join-Path $PWD "codec-$extension-smoke.txt"
            $p = Start-Process -FilePath $exe -ArgumentList @('--audio-smoke', "--media=`"$media`"", "--result=`"$result`"") -PassThru
            if (-not $p.WaitForExit(45000)) { $p.Kill(); throw "$extension smoke timed out" }
            if (-not (Test-Path $result)) { throw "$extension process exited without a result" }
            Get-Content $result
            if ($p.ExitCode -ne 0) { throw "$extension integration failed" }
          }
      - name: Summarize test and runtime evidence
        shell: pwsh
        run: |
          $tests = 0; $failures = 0
          Get-ChildItem -Recurse -Path . -Filter 'TEST-*.xml' | Where-Object FullName -Match 'test-results' | ForEach-Object {
            [xml]$report = Get-Content $_.FullName
            $tests += [int]$report.testsuite.tests
            $failures += [int]$report.testsuite.failures + [int]$report.testsuite.errors
          }
          "Tests: $tests; failures/errors: $failures" | Tee-Object -FilePath test-summary.txt
          Get-Content "$env:JAVA_HOME/release" | Out-File runtime-build.txt
          Get-Content app-desktop/build/generated/notices/licenses/DEPENDENCIES.txt | Out-File dependency-inventory.txt
          if ($tests -lt 18 -or $failures -ne 0) { throw 'Expected test suites did not all run successfully' }
      - name: Collect separately licensed dependency sources
        shell: pwsh
        run: |
          .\gradlew.bat --no-daemon :app-desktop:collectDependencySources
          if ($LASTEXITCODE -ne 0) { throw 'Dependency source collection failed' }
          Invoke-WebRequest 'https://github.com/openjdk/jfx21u/archive/refs/tags/21.0.9%2B1.zip' -OutFile 'build/dependency-sources/OpenJFX-21.0.9-native-source.zip'
          Compress-Archive -Path 'build/dependency-sources/*' -DestinationPath dependency-sources.zip
      - name: Archive corresponding source and portable app
        shell: pwsh
        run: |
          git archive --format=zip -o podium-air-windows-source.zip HEAD
          Compress-Archive -Path 'app-desktop/build/compose/binaries/main/app/Podium Air' -DestinationPath podium-air-windows-portable.zip
          Get-FileHash app-desktop/build/compose/binaries/main/msi/*.msi, app-desktop/build/compose/binaries/main/exe/*.exe, podium-air-windows-portable.zip, podium-air-windows-source.zip, dependency-sources.zip -Algorithm SHA256 | Format-List | Out-File SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Podium-Air-Windows-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            app-desktop/build/compose/binaries/main/msi/*.msi
            app-desktop/build/compose/binaries/main/exe/*.exe
            podium-air-windows-portable.zip
            podium-air-windows-source.zip
            dependency-sources.zip
            SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-verification
          path: |
            **/build/reports/tests/
            **/build/test-results/test/
            ui-smoke.txt
            ui-smoke.png
            audio-smoke.txt
            codec-*-smoke.txt
            windows-media-smoke.txt
            test-summary.txt
            runtime-build.txt
            dependency-inventory.txt
